name: Build native release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "walletcore-v*"

permissions:
  contents: write

jobs:
  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios-macabi,x86_64-apple-ios-macabi
      - name: Build Apple XCFramework
        env:
          OUT_DIR: ${{ github.workspace }}/.build/artifacts
          CARGO_FEATURES: compile-time-generators
        run: ./Scripts/build_xcframework.sh
      - name: Package Apple artifact
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/.build/artifacts
          DIST_DIR: ${{ github.workspace }}/dist
          SOURCE_COMMIT: ${{ github.sha }}
          RUSTC_VERSION: 1.97.1
          XCODE_VERSION: ${{ runner.os }}-${{ runner.arch }}
          ANDROID_NDK_VERSION: not-applicable
          CARGO_FEATURES: compile-time-generators
        run: ./Scripts/package_release_artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: walletcore-apple
          path: |
            dist/MoneroWalletCore.xcframework.zip
            dist/BUILD-MANIFEST.txt
            dist/SHA256SUMS.txt

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "ndk;27.1.12297006"
      - name: Build Android libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
          ANDROID_API: 26
          CARGO_FEATURES: compile-time-generators
          ABIS: arm64-v8a,x86_64
          OUT_DIR: ${{ github.workspace }}/.build/artifacts/android
        run: ./Scripts/build_android.sh
      - name: Package Android artifact
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/.build/artifacts
          DIST_DIR: ${{ github.workspace }}/dist
          SOURCE_COMMIT: ${{ github.sha }}
          RUSTC_VERSION: 1.97.1
          ANDROID_NDK_VERSION: 27.1.12297006
          CARGO_FEATURES: compile-time-generators
        run: ./Scripts/package_release_artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: walletcore-android
          path: |
            dist/MoneroWalletCore-android.zip
            dist/BUILD-MANIFEST.txt
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [apple, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: walletcore-apple
          path: dist/apple
      - uses: actions/download-artifact@v4
        with:
          name: walletcore-android
          path: dist/android
      - name: Combine release metadata
        run: |
          cp dist/apple/MoneroWalletCore.xcframework.zip dist/
          cp dist/android/MoneroWalletCore-android.zip dist/
          mv dist/apple/BUILD-MANIFEST.txt dist/BUILD-MANIFEST-apple.txt
          mv dist/android/BUILD-MANIFEST.txt dist/BUILD-MANIFEST-android.txt
          cat dist/apple/SHA256SUMS.txt dist/android/SHA256SUMS.txt > dist/SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; preserving its published assets."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.zip dist/*.txt
