[package]
name = "walletcore"
version = "0.1.0"
edition = "2021"

[lib]
name = "monerowalletcore"
crate-type = ["cdylib", "staticlib"]

[features]
# Enable scanner micro-profiler plumbing (compile-time + runtime).
# Runtime toggle is controlled via env var: MONERO_WALLET_SCANNER_MICROPROF=1
scanner-microprof = ["monero-wallet/scanner-microprof"]

[dependencies]
monero-wallet = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-wallet", features = ["std"] }
monero-seed = { git = "https://github.com/monero-oxide/monero-wallet-util", package = "monero-seed", features = ["std"] }
monero-address = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-address", features = ["std"] }
monero-ed25519 = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-ed25519", features = ["std"] }
monero-interface = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-interface", features = ["std", "walletcore-lenient-prunable", "walletcore-lenient-tx-verify"] }

# Upstream daemon RPC implementation + recommended HTTP transport (simple-request)
monero-daemon-rpc = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-daemon-rpc", features = ["std", "walletcore-telemetry", "walletcore-lenient-prunable"] }
monero-simple-request-rpc = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-simple-request-rpc", features = ["webpki-roots"] }

# Required because we construct a lightweight runtime (Runtime::new + block_on) around upstream async daemon RPC.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

sha3 = { version = "0.10", default-features = false, features = ["std"] }
zeroize = { version = "1.5", default-features = false, features = ["zeroize_derive", "std"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
monero-io = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-io", features = ["std"] }
monero-epee = { git = "https://github.com/cacaosteve/monero-oxide", rev = "98191b4c20378022a4f5aa04fe7b359a2cdcfacd", package = "monero-epee" }

# Locate Application Support / data directory for per-wallet log file writing
dirs = "5"

# Buf/BufMut traits used by cuprate-epee-encoding helpers in our debug tooling
bytes = "1"

# Portable storage (EPEE) encoder used to correctly construct monerod *.bin request bodies
# (e.g. /get_blocks_by_height.bin) instead of hand-rolling the binary format.
cuprate-epee-encoding = { git = "https://github.com/Cuprate/cuprate", package = "cuprate-epee-encoding" }

once_cell = "1.19"
ureq = { version = "2", features = ["tls", "json"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos")))'.dependencies]
zmq = "0.10"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[profile.release]
overflow-checks = false

[profile.dev]
overflow-checks = true

# Use your local monero-oxide checkout so we can enable local-only features (e.g. scanner-microprof)
# without needing to push them to the upstream git revision.
[patch."https://github.com/cacaosteve/monero-oxide"]
monero-wallet = { path = "../../monero-oxide/monero-oxide/wallet" }
monero-oxide = { path = "../../monero-oxide/monero-oxide" }
monero-interface = { path = "../../monero-oxide/monero-oxide/interface" }
monero-daemon-rpc = { path = "../../monero-oxide/monero-oxide/interface/daemon" }
monero-simple-request-rpc = { path = "../../monero-oxide/monero-oxide/interface/daemon/simple-request" }
monero-address = { path = "../../monero-oxide/monero-oxide/wallet/address" }
monero-ed25519 = { path = "../../monero-oxide/monero-oxide/ed25519" }
monero-io = { path = "../../monero-oxide/monero-oxide/io" }
monero-epee = { path = "../../monero-oxide/monero-oxide/epee" }
